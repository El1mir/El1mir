name: Update star radar

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gen-stars.mjs"
      - ".github/workflows/star-radar.yml"

permissions:
  contents: write

concurrency:
  group: star-radar
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate assets/star-radar.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-stars.mjs

      - name: Commit when the chart changed
        run: |
          if git diff --quiet -- assets/star-radar.svg; then
            echo "No star changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-radar.svg
          git commit -m "chore(stars): refresh star radar"
          git push
